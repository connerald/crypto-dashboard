<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>BTC 实时价格告警</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@10.3.3/highcharts.js"></script>
</head>
<body>
    <h1>BTC 实时价格告警</h1>
    <div style="font-size: 18px; margin: 10px 0;">
        <b>最新BTC价格：</b><span id="price">--</span>
        <span style="margin-left: 20px;">
            <b>1分钟涨跌幅：</b><span id="change" style="font-weight: bold;">--</span>
        </span>
    </div>
    <!-- 涨跌幅告警显示区域 -->
    <div id="alert-container" style="margin: 20px 0; padding: 10px; background-color: #ffe6e6; border: 1px solid #ff9999; display: none;">
        <h3>📈 涨跌幅预警</h3>
        <div id="alert"></div>
    </div>
    <div id="chart-container" style="width: 100%; height: 400px;"></div>
    
    <script>
        var priceData = [];
        var chart = Highcharts.chart('chart-container', {
            chart: { type: 'line' },
            title: { text: 'BTC 实时价格曲线' },
            xAxis: { type: 'datetime' },
            yAxis: { title: { text: '价格 (USDT)' } },
            series: [{
                name: 'BTC/USDT',
                data: priceData
            }]
        });

        var socket = io();
        
        // 价格数据处理
        socket.on('btc_price', function(msg) {
            var price = parseFloat(msg.price);
            // ts 是 Binance 成交时间（Unix 毫秒），不使用浏览器接收时间兜底。
            var timestamp = msg.ts;
            if (!Number.isFinite(price) || !Number.isSafeInteger(timestamp) || timestamp <= 0) {
                return;
            }
            chart.series[0].addPoint([timestamp, price], true, chart.series[0].data.length > 60);
            document.getElementById('price').innerText = price;
            console.log("最新BTC价格：", price);
        });

        // 新增：涨跌幅数据处理
        socket.on('btc_change', function(msg) {
            var changePercent = parseFloat(msg.change_percent);
            var changeElement = document.getElementById('change');
            var changeText = changePercent.toFixed(2) + '%';
            
            // 根据涨跌设置颜色
            if (changePercent > 0) {
                changeElement.style.color = 'red';
                changeText = '+' + changeText;
            } else if (changePercent < 0) {
                changeElement.style.color = 'green';
            } else {
                changeElement.style.color = 'black';
            }
            
            changeElement.innerText = changeText;
            console.log("1分钟涨跌幅：", changeText);
        });

        // 涨跌幅告警处理
        socket.on('btc_alert', function(msg) {
            document.getElementById('alert').innerHTML = msg.data;
            document.getElementById('alert-container').style.display = 'block';
            // 5秒后隐藏告警
            setTimeout(function() {
                document.getElementById('alert-container').style.display = 'none';
            }, 5000);
            console.log("收到涨跌幅告警：", msg.data);
        });
    </script>
</body>
</html>
