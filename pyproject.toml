[project]
name = "crypto-dashboard"
version = "0.1.0"
description = "A real-time cryptocurrency dashboard powered by Kafka and Spark Structured Streaming."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-socketio>=5.5,<6",
    "kafka-python>=2.3,<3",
    "pyspark>=3.5.9,<3.6",
    "python-socketio>=5.13,<6",
    "requests>=2.32,<3",
]

[tool.uv]
package = false
required-version = ">=0.11"
environments = [
    "sys_platform == 'linux'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
